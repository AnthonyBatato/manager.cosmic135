{% extends "base.html" %}{% load i18n %}{% block content %}<div class="public-message"><p class="eyebrow">{% trans "RESCHEDULE" %}</p><h1>{% trans "Choose another time" %}</h1><p>{{ booking.booking_type.name_en }} · {{ booking.booking_type.timezone }}</p><form method="post" class="booking-card">{% csrf_token %}<label>{% trans "Available times" %}<select name="starts_at" required><option value="">{% trans "Select a time" %}</option>{% for slot in slots %}<option value="{{ slot.start.isoformat }}">{{ slot.start|date:"D, d M · H:i" }}</option>{% endfor %}</select></label><button class="button primary full">{% trans "Confirm new time" %}</button></form></div>{% endblock %}
