# Temporary HTTP-only configuration for issuing the first certificate for
# x.cosmic135.com. Replace this file with x.cosmic135.conf after Certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name x.cosmic135.com;

    client_max_body_size 30m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://manager135:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
